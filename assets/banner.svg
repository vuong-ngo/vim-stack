<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Title gradient (Green to Blue) -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Vim green gradient -->
    <linearGradient id="vim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Neovim blue/purple gradient -->
    <linearGradient id="neovim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Pane borders -->
    <linearGradient id="pane-border-vim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pane-border-neovim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="glow-vim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-neovim" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Subtle shadow for panes -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="900" height="340" rx="16" fill="url(#grid)" />

  <!-- Background Glow Orbs -->
  <circle cx="200" cy="200" r="120" fill="#10B981" opacity="0.08" filter="url(#glow-vim)" />
  <circle cx="700" cy="200" r="120" fill="#6366F1" opacity="0.08" filter="url(#glow-neovim)" />

  <!-- Header Section -->
  <text x="450" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="url(#title-grad)" letter-spacing="4">VIM STACK</text>
  <text x="450" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#94A3B8">Dual Editor Configurations • Parity in Keymaps • Uncompromising Efficiency</text>

  <!-- ==================== LEFT PANE (MINIMAL VIM) ==================== -->
  <g filter="url(#shadow)">
    <!-- Outer Border & Background -->
    <rect x="60" y="100" width="300" height="180" rx="8" fill="#080c16" stroke="url(#pane-border-vim)" stroke-width="1.5"/>
    <!-- Titlebar -->
    <rect x="60" y="100" width="300" height="24" rx="8" fill="#111625"/>
    <rect x="60" y="116" width="300" height="8" fill="#111625"/> <!-- cover bottom rounded corners of title bar -->
    <!-- Window Controls -->
    <circle cx="76" cy="112" r="4" fill="#EF4444" />
    <circle cx="88" cy="112" r="4" fill="#F59E0B" />
    <circle cx="100" cy="112" r="4" fill="#10B981" />
    <!-- Title -->
    <text x="210" y="116" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748B" font-weight="bold">minimal-vim (~/.vimrc)</text>
    
    <!-- Code Editor Content -->
    <!-- Line numbers -->
    <text x="80" y="145" font-family="monospace" font-size="10" fill="#475569" text-anchor="end">1</text>
    <text x="80" y="160" font-family="monospace" font-size="10" fill="#475569" text-anchor="end">2</text>
    <text x="80" y="175" font-family="monospace" font-size="10" fill="#475569" text-anchor="end">3</text>
    <text x="80" y="190" font-family="monospace" font-size="10" fill="#475569" text-anchor="end">4</text>
    <text x="80" y="205" font-family="monospace" font-size="10" fill="#475569" text-anchor="end">5</text>
    
    <!-- Code Lines -->
    <text x="95" y="145" font-family="monospace" font-size="10" fill="#34D399">" Sensible Defaults</text>
    <text x="95" y="160" font-family="monospace" font-size="10" fill="#E2E8F0"><tspan fill="#34D399">set</tspan> number</text>
    <text x="95" y="175" font-family="monospace" font-size="10" fill="#E2E8F0"><tspan fill="#34D399">set</tspan> clipboard=unnamedplus</text>
    <text x="95" y="190" font-family="monospace" font-size="10" fill="#E2E8F0"><tspan fill="#34D399">let</tspan> mapleader = <tspan fill="#38BDF8">" "</tspan></text>
    <text x="95" y="205" font-family="monospace" font-size="10" fill="#E2E8F0"><tspan fill="#34D399">nnoremap</tspan> &lt;leader&gt;e :Ex&lt;CR&gt;</text>
    
    <!-- Block Cursor -->
    <rect x="256" y="196" width="6" height="11" fill="#34D399" opacity="0.7"/>

    <!-- Statusline -->
    <rect x="61" y="255" width="298" height="24" fill="#047857" />
    <rect x="61" y="255" width="70" height="24" fill="#10B981"/>
    <text x="96" y="271" text-anchor="middle" font-family="monospace" font-size="10" fill="#FFFFFF" font-weight="bold">NORMAL</text>
    <text x="140" y="271" font-family="monospace" font-size="10" fill="#E2E8F0" font-weight="bold">.vimrc</text>
    <text x="350" y="271" text-anchor="end" font-family="monospace" font-size="10" fill="#E2E8F0" font-weight="bold">5:24 100%</text>
  </g>

  <!-- ==================== CONNECTION BRIDGE ==================== -->
  <g>
    <!-- Path Animation simulated with dashed path -->
    <path d="M 360 190 Q 450 170 540 190" fill="none" stroke="url(#title-grad)" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.8" />
    
    <!-- Sync Badge -->
    <rect x="400" y="165" width="100" height="32" rx="16" fill="#0e1329" stroke="#06B6D4" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="450" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#22D3EE" letter-spacing="1">1:1 KEYMAPS</text>
  </g>

  <!-- ==================== RIGHT PANE (LAZYVIM) ==================== -->
  <g filter="url(#shadow)">
    <!-- Outer Border & Background -->
    <rect x="540" y="100" width="300" height="180" rx="8" fill="#070a13" stroke="url(#pane-border-neovim)" stroke-width="1.5"/>
    <!-- Titlebar -->
    <rect x="540" y="100" width="300" height="24" rx="8" fill="#0f1422"/>
    <rect x="540" y="116" width="300" height="8" fill="#0f1422"/> <!-- cover bottom rounded corners of title bar -->
    <!-- Window Controls -->
    <circle cx="556" cy="112" r="4" fill="#EF4444" />
    <circle cx="568" cy="112" r="4" fill="#F59E0B" />
    <circle cx="580" cy="112" r="4" fill="#10B981" />
    <!-- Title -->
    <text x="690" y="116" text-anchor="middle" font-family="monospace" font-size="11" fill="#5A6D80" font-weight="bold">lazyvim (lua/config/)</text>
    
    <!-- Sidebar File Explorer (Snacks Explorer Mock) -->
    <rect x="541" y="125" width="75" height="130" fill="#0b0e1a" />
    <text x="546" y="142" font-family="monospace" font-size="9" fill="#60A5FA">📁 lua/</text>
    <text x="554" y="157" font-family="monospace" font-size="9" fill="#38BDF8">📁 config/</text>
    <text x="562" y="172" font-family="monospace" font-size="9" fill="#10B981">📄 init.lua</text>
    <text x="562" y="187" font-family="monospace" font-size="9" fill="#94A3B8">📄 lazy.lua</text>
    <text x="554" y="202" font-family="monospace" font-size="9" fill="#60A5FA">📁 plugins/</text>
    
    <!-- Editor Content -->
    <!-- Line numbers -->
    <text x="630" y="145" font-family="monospace" font-size="9" fill="#4B5563" text-anchor="end">4</text>
    <text x="630" y="160" font-family="monospace" font-size="9" fill="#4B5563" text-anchor="end">5</text>
    <text x="630" y="175" font-family="monospace" font-size="9" fill="#38BDF8" text-anchor="end">6</text>
    <text x="630" y="190" font-family="monospace" font-size="9" fill="#4B5563" text-anchor="end">7</text>
    <text x="630" y="205" font-family="monospace" font-size="9" fill="#4B5563" text-anchor="end">8</text>
    
    <!-- Code Lines -->
    <text x="640" y="145" font-family="monospace" font-size="9" fill="#F472B6">local<tspan fill="#F3F4F6"> map = vim.keymap</tspan></text>
    <text x="640" y="160" font-family="monospace" font-size="9" fill="#93C5FD">-- Sync keys with vimrc</text>
    <text x="640" y="175" font-family="monospace" font-size="9" fill="#F3F4F6">map.set(<tspan fill="#FB923C">"n"</tspan>, <tspan fill="#A78BFA">"&lt;leader&gt;e"</tspan>,</text>
    <text x="640" y="190" font-family="monospace" font-size="9" fill="#F3F4F6">  <tspan fill="#60A5FA">function</tspan>() Snacks.explorer()</text>
    <text x="640" y="205" font-family="monospace" font-size="9" fill="#F3F4F6">  <tspan fill="#F472B6">end</tspan>, { desc = <tspan fill="#FB923C">"Explorer"</tspan> })</text>

    <!-- Autocomplete Popup -->
    <g filter="url(#shadow)">
      <rect x="655" y="208" width="125" height="40" rx="4" fill="#121824" stroke="#06B6D4" stroke-width="1" />
      <text x="662" y="222" font-family="monospace" font-size="9" fill="#22D3EE">Snacks</text>
      <text x="740" y="222" font-family="monospace" font-size="7.5" fill="#475569">[lsp] explorer</text>
      <line x1="655" y1="227" x2="780" y2="227" stroke="#06B6D4" stroke-width="0.5" opacity="0.3"/>
      <text x="662" y="238" font-family="monospace" font-size="9" fill="#E2E8F0">Snacks.terminal</text>
    </g>

    <!-- Statusline -->
    <rect x="541" y="255" width="298" height="24" fill="#0f172a" />
    <rect x="541" y="255" width="60" height="24" fill="#8B5CF6" />
    <text x="571" y="271" text-anchor="middle" font-family="monospace" font-size="9" fill="#FFFFFF" font-weight="bold">NORMAL</text>
    <text x="610" y="271" font-family="monospace" font-size="9" fill="#818CF8"> main</text>
    <text x="660" y="271" font-family="monospace" font-size="9" fill="#94A3B8">keymaps.lua</text>
    <text x="830" y="271" text-anchor="end" font-family="monospace" font-size="9" fill="#10B981">󰄵 blink.cmp</text>
  </g>

  <!-- ==================== FEATURE BADGES ==================== -->
  <g transform="translate(145, 305)">
    <!-- Badge 1: 0-Dependency Vim -->
    <rect x="0" y="0" width="140" height="22" rx="11" fill="#10B981" opacity="0.15"/>
    <rect x="0" y="0" width="140" height="22" rx="11" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4"/>
    <text x="70" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34D399">0-Dependency Vim</text>

    <!-- Badge 2: Modern Neovim -->
    <rect x="155" y="0" width="140" height="22" rx="11" fill="#3B82F6" opacity="0.15"/>
    <rect x="155" y="0" width="140" height="22" rx="11" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
    <text x="225" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#60A5FA">LazyVim 0.10+ IDE</text>

    <!-- Badge 3: Synced Behaviors -->
    <rect x="310" y="0" width="140" height="22" rx="11" fill="#8B5CF6" opacity="0.15"/>
    <rect x="310" y="0" width="140" height="22" rx="11" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.4"/>
    <text x="380" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#A78BFA">Muscle Memory Sync</text>
    
    <!-- Badge 4: Clean Specs -->
    <rect x="465" y="0" width="140" height="22" rx="11" fill="#EC4899" opacity="0.15"/>
    <rect x="465" y="0" width="140" height="22" rx="11" fill="none" stroke="#EC4899" stroke-width="1" opacity="0.4"/>
    <text x="535" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#F472B6">Optimized Specs</text>
  </g>
</svg>
